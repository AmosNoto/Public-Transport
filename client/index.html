<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d12">
  <title>Afterglow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
</head>
<body>
  <canvas id="gl" aria-label="Live map of public transit vehicles"></canvas>
  <div id="fallback" hidden><p>Afterglow needs WebGL 2, which this browser doesn't provide.</p></div>

  <header class="hud tl">
    <button id="city-btn" class="city-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="switcher">
      <h1 id="city-name">Earth</h1>
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
    </button>
    <p class="mono" id="city-time">--:--</p>
    <div id="switcher" class="panel" hidden>
      <input id="city-search" type="search" placeholder="Find a city" autocomplete="off" spellcheck="false" aria-label="Find a city">
      <ul id="city-list" role="listbox" aria-label="Cities"></ul>
    </div>
  </header>

  <section class="hud bl" aria-live="off">
    <p class="eyebrow" id="count-label">Moving worldwide</p>
    <p class="count"><span class="mono big" id="count-city">0</span></p>
    <p class="mono small" id="count-sched" hidden></p>
    <p class="mono small" id="count-world-row" hidden>worldwide <span id="count-world">0</span></p>
  </section>

  <nav class="hud br">
    <p id="legend" class="legend" hidden></p>
    <div class="row">
      <div id="modes" class="modes" role="group" aria-label="Transport modes"></div>
      <button id="credits-btn" class="mode on" aria-label="Data sources and credits" title="Data sources and credits">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 9v5M10 6.5v.1"/></svg>
      </button>
    </div>
    <div id="credits" class="panel" hidden>
      <p class="eyebrow">Data</p>
      <ul id="credits-list"></ul>
    </div>
  </nav>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
